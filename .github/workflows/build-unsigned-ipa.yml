name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SCHEME: HealthCheckApp
  PROJECT_FILE: HealthCheckApp.xcodeproj
  APP_NAME: HealthCheckApp
  CONFIGURATION: Release

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          which brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew update
          brew install xcodegen || true
          brew install xcpretty || true

      - name: Generate Xcode project
        run: |
          chmod +x ./scripts/generate_project.sh
          ./scripts/generate_project.sh

      - name: Display Xcode
        run: xcodebuild -version

      - name: Clean and archive (unsigned)
        run: |
          set -e
          ARCHIVE_DIR="$PWD/build"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE_PATH="$ARCHIVE_DIR/${{ env.SCHEME }}.xcarchive"

          xcodebuild clean -project "${{ env.PROJECT_FILE }}" -scheme "${{ env.SCHEME }}" -configuration "${{ env.CONFIGURATION }}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty || true

          xcodebuild -project "${{ env.PROJECT_FILE }}" -scheme "${{ env.SCHEME }}" -configuration "${{ env.CONFIGURATION }}" -archivePath "$ARCHIVE_PATH" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty

          ls -la "$ARCHIVE_PATH"

      - name: Package unsigned .ipa
        id: package
        run: |
          set -e
          ARCHIVE_PATH="$PWD/build/${{ env.SCHEME }}.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/${{ env.APP_NAME }}.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            echo "Contents of archive:"
            find "$ARCHIVE_PATH" -maxdepth 5 -type f -print || true
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ZIP_NAME="${{ env.SCHEME }}-unsigned.ipa"
          rm -f "$ZIP_NAME"
          zip -qry "$ZIP_NAME" Payload

          echo "ipa_path=$PWD/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Artifact: $ZIP_NAME"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}

