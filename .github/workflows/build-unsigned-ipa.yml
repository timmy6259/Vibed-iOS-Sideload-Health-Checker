name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SCHEME: HealthCheckApp
  PROJECT_FILE: HealthCheckApp.xcodeproj
  APP_NAME: HealthCheckApp
  CONFIGURATION: Release

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the unsigned app
        run: |
          set -e
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project "${{ env.PROJECT_FILE }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            SYMROOT="$PWD/build/sym" \
            build
          find "$PWD/build" -maxdepth 5 -type d -name "*.app" -print

      - name: Package unsigned .ipa
        id: package
        run: |
          set -e
          APP_PATH="$(find "$PWD/build" -type d -name "${{ env.APP_NAME }}.app" | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "App not found under $PWD/build"
            find "$PWD/build" -maxdepth 6 -print | head -200
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          ZIP_NAME="${{ env.APP_NAME }}-unsigned.ipa"
          rm -f "$ZIP_NAME"
          zip -qry "$ZIP_NAME" Payload

          echo "ipa_path=$PWD/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ steps.package.outputs.ipa_path }}